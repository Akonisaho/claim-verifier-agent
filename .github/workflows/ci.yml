name: CI Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-test:
    name: Lint, SAST & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff bandit pytest pip-audit
      - name: Lint (ruff)
        run: ruff check .
      - name: SAST (bandit)
        run: bandit -r . -ll -x ./tests
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Unit tests
        run: pytest -q

  dockerfile-lint:
    name: Dockerfile Best Practices (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  container-scan:
    name: Build Image + Vulnerability & License Scan (Trivy)
    runs-on: ubuntu-latest
    needs: dockerfile-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t research-claim-verifier:ci .

      - name: Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "research-claim-verifier:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "table"
          # Fail on anything with a real fix available (verified locally:
          # the Dockerfile now runs apt-get upgrade to pick those up).
          # Debian's base-image OS packages (perl-base, gzip, libsqlite3,
          # etc.) carry several CVEs with no upstream fix yet
          # (status "affected"/"fix_deferred", no fixed version) - these
          # exist in a stock, freshly-pulled python:3.12-slim too, and
          # failing CI on an unfixable finding provides no signal.
          ignore-unfixed: "true"

      - name: Trivy license scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "research-claim-verifier:ci"
          scanners: "license"
          # Scope to our own Python dependencies, not the base Debian OS.
          # Verified locally: a stock Debian base carries ~300 HIGH
          # "restricted" (GPL/LGPL) license findings on system packages
          # (bash, coreutils, tar, ...) - that's normal for any
          # Debian-based image and not something an application's license
          # policy is meant to gate on. Our actual dependencies (pydantic,
          # requests, pytest, etc.) are all permissively licensed.
          vuln-type: "library"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "table"
          ignore-unfixed: "true"

      - name: Smoke test the built image
        # Phase 1 snapshot: only baseline.py exists yet (app.py/evaluate.py
        # land in Phase 2). This checks what this branch actually ships.
        run: docker run --rm research-claim-verifier:ci python -c "import baseline; print('image runs OK')"

  submission-completeness:
    name: Submission Completeness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files exist
        run: |
          required=("README.md" "CHANGELOG.md" "REPRODUCE.md" "Dockerfile" "requirements.txt")
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Required submission files are missing."
            exit 1
          fi
